services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopcore}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init/00-databases.sql:/docker-entrypoint-initdb.d/00-databases.sql:ro
      - ./infra/postgres/init/01-apply-schemas.sh:/docker-entrypoint-initdb.d/01-apply-schemas.sh:ro
      - ./infra/postgres/schemas:/schemas:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  gateway:
    build: ../gateway-service
    environment:
      GATEWAY_PORT: 8080
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started

  user-service:
    build:
      context: ..
      dockerfile: user-service/Dockerfile
    environment:
      USER_SERVICE_PORT: 8081
      USER_GRPC_PORT: 50051
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-shopcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopcore}
      JWT_PRIVATE_KEY_PATH: /run/secrets/private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/public.pem
      ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY:-}
    volumes:
      - ./secrets:/run/secrets:ro
    expose:
      - "50051"
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build:
      context: ..
      dockerfile: product-service/Dockerfile
    environment:
      PRODUCT_SERVICE_PORT: 8082
      PRODUCT_GRPC_PORT: 50052
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-shopcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopcore}
      JWT_PUBLIC_KEY_PATH: /run/secrets/public.pem
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local-internal-service-secret}
    volumes:
      - ./secrets:/run/secrets:ro
    expose:
      - "50052"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: ..
      dockerfile: order-service/Dockerfile
    environment:
      ORDER_SERVICE_PORT: 8083
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-shopcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopcore}
      JWT_PUBLIC_KEY_PATH: /run/secrets/public.pem
      PRODUCT_SERVICE_URL: http://product-service:8082
      USER_GRPC_ADDRESS: user-service:50051
      PRODUCT_GRPC_ADDRESS: product-service:50052
      KAFKA_BROKERS: kafka:9092
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-local-internal-service-secret}
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      product-service:
        condition: service_started
      user-service:
        condition: service_started

  email-service:
    build: ../email-service
    environment:
      EMAIL_SERVICE_PORT: 8084
      KAFKA_BROKERS: kafka:9092
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
